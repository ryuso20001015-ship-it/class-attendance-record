<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授業出欠記録システム</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (BIZ UDPGothic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"BIZ UDPGothic"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>

  <!-- Firebase (Modular版) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.fb = {
      initializeApp, getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, setPersistence, browserSessionPersistence,
      getFirestore, doc, setDoc, getDoc, onSnapshot, collection
    };
    window.dispatchEvent(new Event('firebase-loaded'));
  </script>

  <style>
    @media print {
      @page { size: A4 landscape; margin: 30mm !important; }
      body { background: white; margin: 0; padding: 0; }
      .print-hidden { display: none !important; }
      .print-expand { width: 100% !important; max-height: none !important; overflow: visible !important; border: none !important; box-shadow: none !important; }
      table { width: 100% !important; border-collapse: collapse; table-layout: auto !important; }
      .sticky { position: static !important; }
      .page-break { page-break-before: always; break-before: page; }
    }
    
    input, select, textarea, button {
      font-family: inherit;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
  
  <div id="root">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'BIZ UDPGothic', sans-serif; color: #4b5563;">
      <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem; color: #1e40af;"></i>
      <h2 style="font-weight: bold; margin-bottom: 0.5rem;">システムを起動しています...</h2>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("エラーを捕捉しました:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 max-w-2xl mx-auto mt-10 bg-white border-t-4 border-red-500 rounded shadow">
              <h2 className="text-xl font-bold text-red-600 mb-4"><i className="fa-solid fa-triangle-exclamation"></i> 予期せぬエラーが発生しました</h2>
              <div className="bg-gray-100 p-4 rounded text-xs font-mono text-red-800 mb-6 overflow-auto">
                {this.state.error && this.state.error.toString()}
              </div>
              <button 
                onClick={() => {
                  if (window.confirm("端末内のデータを初期化して再読み込みします。よろしいですか？")) {
                    localStorage.removeItem('attendance_app_data');
                    localStorage.removeItem('last_uid');
                    window.location.reload();
                  }
                }}
                className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold flex items-center gap-2"
              >
                <i className="fa-solid fa-trash-can"></i> データを初期化して復旧する
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const safeStorage = {
      get: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
      set: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } },
      removeItem: (key) => { try { localStorage.removeItem(key); } catch (e) { } }
    };

    const STATUS_OPTIONS = [
      { label: "-", value: "", color: "bg-white text-gray-800" },
      { label: "欠席", value: "欠席", color: "bg-red-100 text-red-800 font-bold" },
      { label: "遅刻", value: "遅刻", color: "bg-yellow-100 text-yellow-800 font-bold" },
      { label: "早退", value: "早退", color: "bg-orange-100 text-orange-800" },
      { label: "保健室", value: "保健室", color: "bg-green-100 text-green-800" },
      { label: "他", value: "その他", color: "bg-gray-100 text-gray-800" },
    ];

    const getStatusConfig = (val) => STATUS_OPTIONS.find(opt => opt.value === val) || STATUS_OPTIONS[0];

    const getLocalDateString = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const DEFAULT_DATA = {
      settings: { grades: { 1: 1, 2: 0, 3: 0 } },
      classes: [
        { 
          classId: "1-1", 
          className: "1年1組",
          students: [
            { id: "s1", number: 1, name: "山田 太郎", furigana: "やまだ たろう", gender: "男", status: "在籍" },
            { id: "s2", number: 2, name: "佐藤 花子", furigana: "さとう はなこ", gender: "女", status: "在籍" },
            { id: "s3", number: 3, name: "鈴木 一郎", furigana: "すずき いちろう", gender: "男", status: "在籍" },
          ] 
        }
      ],
      lessons: [
        { id: "l1", classId: "1-1", count: 1, date: getLocalDateString(), isLocked: false }
      ],
      attendances: {}
    };

    function AuthModal({ onLogin, onGuestLogin, onRegister }) {
      const [mode, setMode] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async () => {
        if (!email) return alert("メールアドレスを入力してください");
        setLoading(true);
        try {
          if (mode === 'login') {
            if (!password) { setLoading(false); return alert("パスワードを入力してください"); }
            await onLogin(email, password);
          } else {
            let currentPass = password;
            if (!currentPass) {
              currentPass = Math.random().toString(36).slice(-8) + "aA1!";
              alert(`パスワードが自動生成されました。\nログインに必要なので必ずメモしてください。\n\nパスワード: ${currentPass}`);
            }
            await onRegister(email, currentPass);
          }
        } catch (e) {
          alert("認証エラー: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      const handleGuest = async () => {
        setLoading(true);
        try {
          await onGuestLogin();
        } catch(e) {
          alert("エラー: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-white z-[200] flex flex-col justify-center items-center">
          {loading ? (
            <div className="flex flex-col items-center justify-center">
              <i className="fa-solid fa-spinner fa-spin text-4xl text-blue-800 mb-4"></i>
              <p className="text-sm font-bold text-gray-500">アカウントを確認中...</p>
            </div>
          ) : (
            <div className="bg-white sm:rounded-xl sm:shadow-2xl p-6 w-full max-w-sm flex flex-col relative sm:border border-gray-200 h-full sm:h-auto justify-center">
              <h2 className="text-2xl font-bold text-blue-800 mb-6 text-center">
                <i className="fa-solid fa-pen mr-2"></i>出欠記録システム
              </h2>

              <div className="bg-blue-50 text-blue-800 text-[10px] p-2.5 rounded mb-4 border border-blue-200">
                <i className="fa-solid fa-shield-halved mr-1"></i> セキュリティ保護のため、ブラウザを閉じると自動的にログアウトされます。
              </div>
              
              <div className="flex mb-6 border-b border-gray-200">
                <button type="button" onClick={() => setMode('login')} className={`flex-1 py-2 text-sm font-bold border-b-2 transition ${mode === 'login' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}`}>ログイン</button>
                <button type="button" onClick={() => setMode('register')} className={`flex-1 py-2 text-sm font-bold border-b-2 transition ${mode === 'register' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}`}>新規作成</button>
              </div>
              
              <div className="space-y-4 mb-6">
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1.5">メールアドレス</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm outline-none focus:border-blue-500 font-bold bg-gray-50 focus:bg-white transition-colors" placeholder="teacher@example.com" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1.5">パスワード</label>
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm outline-none focus:border-blue-500 font-bold bg-gray-50 focus:bg-white transition-colors" placeholder="••••••••" />
                  {mode === 'register' && <p className="text-[10px] text-gray-500 mt-1.5"><i className="fa-solid fa-info-circle"></i> 未入力の場合は自動生成されます。</p>}
                </div>
              </div>

              <button type="button" onClick={handleSubmit} className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-sm mb-6 text-sm">
                {mode === 'login' ? 'ログイン' : 'アカウント作成'}
              </button>

              <div className="relative flex items-center justify-center mb-6">
                <div className="absolute border-t border-gray-300 w-full"></div>
                <span className="bg-white px-3 text-xs text-gray-400 font-bold relative z-10">または</span>
              </div>

              <button type="button" onClick={handleGuest} className="w-full bg-gray-50 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-100 border border-gray-300 transition shadow-sm text-sm">
                <i className="fa-solid fa-user-secret mr-1.5"></i> ゲストとして利用（お試し）
              </button>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('attendance');
      const [appData, setAppData] = useState(DEFAULT_DATA);
      const [isLoaded, setIsLoaded] = useState(false);
      const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
      
      const [past, setPast] = useState([]);
      const [future, setFuture] = useState([]);

      const [fbApp, setFbApp] = useState(null);
      const [auth, setAuth] = useState(null);
      const [db, setDb] = useState(null);
      const [appId, setAppId] = useState('default-app-id');
      const [user, setUser] = useState(null);
      const [authInitialized, setAuthInitialized] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(true);

      const lastCloudUpdateTime = useRef(0);
      const isIncomingUpdate = useRef(false);
      const initialLoadDone = useRef(false);
      const [isSyncing, setIsSyncing] = useState(false);

      useEffect(() => {
        const initFb = () => {
          const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyCMssHig9YsBwXue4ujMTvpSwLtf1u92mY",
            authDomain: "class-attendance-record.firebaseapp.com",
            databaseURL: "https://class-attendance-record-default-rtdb.firebaseio.com",
            projectId: "class-attendance-record",
            storageBucket: "class-attendance-record.firebasestorage.app",
            messagingSenderId: "829706690099",
            appId: "1:829706690099:web:63c41a0313ef7717798d46"
          };
          const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          setAppId(currentAppId);
          
          const application = window.fb.initializeApp(config);
          setFbApp(application);
          const authInstance = window.fb.getAuth(application);
          setAuth(authInstance);
          setDb(window.fb.getFirestore(application));

          window.fb.setPersistence(authInstance, window.fb.browserSessionPersistence)
            .catch(err => console.error("Persistence設定エラー:", err));
        };

        if (window.fb) {
          initFb();
        } else {
          const onLoaded = () => {
            initFb();
            window.removeEventListener('firebase-loaded', onLoaded);
          };
          window.addEventListener('firebase-loaded', onLoaded);
        }
      }, []);

      useEffect(() => {
        try {
          const saved = safeStorage.get('attendance_app_data');
          if (saved) {
            let parsed = JSON.parse(saved);
            if (parsed && parsed.classes) {
              if (!parsed.settings.grades) {
                parsed.settings.grades = {
                  1: parsed.settings.grade === 1 ? (parsed.settings.classCount || 1) : (parsed.classes.filter(c => c.classId.startsWith('1-')).length || 0),
                  2: parsed.settings.grade === 2 ? (parsed.settings.classCount || 1) : (parsed.classes.filter(c => c.classId.startsWith('2-')).length || 0),
                  3: parsed.settings.grade === 3 ? (parsed.settings.classCount || 1) : (parsed.classes.filter(c => c.classId.startsWith('3-')).length || 0),
                };
              }
              parsed.classes.forEach(c => {
                c.students.forEach(s => { if (!s.status) s.status = "在籍"; });
              });
              if (parsed.lessons) {
                parsed.lessons = parsed.lessons.map(l => ({ ...l, isLocked: l.isLocked || false }));
              }
              setAppData(parsed);
            }
          }
        } catch (e) {
          console.error("データのパースに失敗しました", e);
        }
        setIsLoaded(true);
      }, []);

      useEffect(() => {
        if (!auth) return;
        const unsubscribe = window.fb.onAuthStateChanged(auth, (currentUser) => {
          if (currentUser) {
            const lastUid = safeStorage.get('last_uid');
            if (lastUid !== currentUser.uid) {
              setAppData(DEFAULT_DATA);
              safeStorage.set('attendance_app_data', JSON.stringify(DEFAULT_DATA));
            }
            lastCloudUpdateTime.current = 0; 
            initialLoadDone.current = false; 

            safeStorage.set('last_uid', currentUser.uid);
            setUser(currentUser);
            setShowAuthModal(false);
            setActiveTab('attendance');
          } else {
            setUser(null);
            setShowAuthModal(true);
            initialLoadDone.current = false; 
            lastCloudUpdateTime.current = 0;
          }
          setAuthInitialized(true);
        });
        return () => unsubscribe();
      }, [auth]);

      useEffect(() => {
        if (!db || !user || !isLoaded) return;
        
        const docRef = window.fb.doc(db, 'artifacts', appId, 'users', user.uid, 'attendance_data', 'main');
        
        const unsubscribe = window.fb.onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            const cloudTime = data.updatedAt ? new Date(data.updatedAt).getTime() : 0;
            if (!initialLoadDone.current || cloudTime > lastCloudUpdateTime.current) {
              lastCloudUpdateTime.current = cloudTime;
              isIncomingUpdate.current = true;
              setAppData(JSON.parse(data.data));
              initialLoadDone.current = true;
            }
          } else {
            initialLoadDone.current = true;
            saveToFirebase(appData);
          }
        }, (error) => {
          console.error("Firestore sync error:", error);
        });
        return () => unsubscribe();
      }, [db, user, isLoaded]);

      useEffect(() => {
        if (isLoaded) {
          safeStorage.set('attendance_app_data', JSON.stringify(appData));
          if (isIncomingUpdate.current) {
            isIncomingUpdate.current = false;
          } else if (initialLoadDone.current) {
            saveToFirebase(appData);
          }
        }
      }, [appData, isLoaded]);

      const saveToFirebase = async (dataToSave) => {
        if (!db || !user || !initialLoadDone.current) return; 
        setIsSyncing(true);
        const now = new Date().toISOString();
        lastCloudUpdateTime.current = new Date(now).getTime();
        try {
          const docRef = window.fb.doc(db, 'artifacts', appId, 'users', user.uid, 'attendance_data', 'main');
          await window.fb.setDoc(docRef, { 
            data: JSON.stringify(dataToSave),
            updatedAt: now 
          });
        } catch (e) {
          console.error("Firebase Sync Error:", e);
        } finally {
          setTimeout(() => setIsSyncing(false), 1000);
        }
      };

      const handleLogin = async (email, password) => {
        await window.fb.signInWithEmailAndPassword(auth, email, password);
      };

      const handleRegister = async (email, password) => {
        await window.fb.createUserWithEmailAndPassword(auth, email, password);
      };

      const handleGuestLogin = async () => {
        await window.fb.signInAnonymously(auth);
      };

      const handleLogout = async () => {
        if (window.confirm("ログアウトしますか？（未保存の同期データは失われる可能性があります）")) {
          initialLoadDone.current = false;
          lastCloudUpdateTime.current = 0;
          setAppData(DEFAULT_DATA);
          safeStorage.removeItem('attendance_app_data');
          safeStorage.removeItem('last_uid');
          await window.fb.signOut(auth);
        }
      };

      const showToast = (message, type = 'info') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 4000);
      };

      const handleSetAppData = (newData) => {
        setPast(prevPast => {
          const newPast = [...prevPast, appData];
          return newPast.length > 30 ? newPast.slice(newPast.length - 30) : newPast;
        });
        setFuture([]); 
        setAppData(newData);
      };

      const undo = () => {
        if (past.length === 0) return;
        const previous = past[past.length - 1];
        setPast(past.slice(0, past.length - 1));
        setFuture([appData, ...future]);
        setAppData(previous);
      };

      const redo = () => {
        if (future.length === 0) return;
        const next = future[0];
        setFuture(future.slice(1));
        setPast([...past, appData]);
        setAppData(next);
      };

      if (!isLoaded || !authInitialized) {
        return (
          <div className="flex flex-col items-center justify-center h-screen bg-gray-50 text-gray-600 font-sans">
            <i className="fa-solid fa-spinner fa-spin text-4xl text-blue-800 mb-4"></i>
            <h2 className="font-bold text-lg mb-2">システムを準備しています...</h2>
          </div>
        );
      }

      return (
        <div>
          {showAuthModal && (
            <AuthModal 
              onLogin={handleLogin} 
              onRegister={handleRegister} 
              onGuestLogin={handleGuestLogin} 
            />
          )}

          <header className="bg-blue-800 text-white shadow-md print-hidden">
            <div className="container mx-auto px-4 py-2 flex flex-wrap justify-between items-center">
              <h1 className="text-xl font-bold flex items-center gap-2">
                <i className="fa-solid fa-pen"></i>
                授業出欠記録システム
              </h1>
              <div className="flex gap-2 mt-1 sm:mt-0 items-center">
                {isSyncing && (
                  <div className="flex items-center text-xs text-blue-200 font-bold mr-2 animate-pulse">
                    <i className="fa-solid fa-cloud-upload-alt mr-1"></i>同期中
                  </div>
                )}
                <div className="flex items-center gap-1 mr-1 pr-2 border-r border-blue-600 print-hidden">
                  <button 
                    onClick={undo} 
                    disabled={past.length === 0} 
                    className={`p-1.5 rounded transition-colors ${past.length === 0 ? 'text-blue-400/50 cursor-not-allowed' : 'text-white hover:bg-blue-700'}`} 
                    title="1つ元に戻す (Undo)"
                  >
                    <i className="fa-solid fa-rotate-left"></i>
                  </button>
                  <button 
                    onClick={redo} 
                    disabled={future.length === 0} 
                    className={`p-1.5 rounded transition-colors ${future.length === 0 ? 'text-blue-400/50 cursor-not-allowed' : 'text-white hover:bg-blue-700'}`} 
                    title="やり直す (Redo)"
                  >
                    <i className="fa-solid fa-rotate-right"></i>
                  </button>
                </div>

                <NavButton 
                  active={activeTab === 'attendance'} 
                  onClick={() => setActiveTab('attendance')} 
                  icon={<i className="fa-solid fa-pen"></i>} 
                  label="出欠記録" 
                />
                <NavButton 
                  active={activeTab === 'settings'} 
                  onClick={() => setActiveTab('settings')} 
                  icon={<i className="fa-solid fa-cog"></i>} 
                  label="生徒情報設定" 
                />
                <NavButton 
                  active={activeTab === 'sync'} 
                  onClick={() => setActiveTab('sync')} 
                  icon={<i className="fa-solid fa-user-circle"></i>} 
                  label="アカウント・同期" 
                />
                
                {user && (
                  <button 
                    onClick={handleLogout}
                    className="ml-1 sm:ml-2 px-2 py-1.5 bg-blue-900/50 hover:bg-red-600/90 rounded border border-blue-700 text-[10px] sm:text-xs font-bold flex items-center gap-1.5 shadow-inner transition-colors group cursor-pointer" 
                    title="クリックしてログアウト"
                  >
                    {user.isAnonymous ? (
                      <><i className="fa-solid fa-user-secret text-yellow-400 group-hover:text-white transition-colors"></i><span className="hidden sm:inline text-blue-100 group-hover:text-white transition-colors">ゲスト</span></>
                    ) : (
                      <><i className="fa-solid fa-user-check text-green-400 group-hover:text-white transition-colors"></i><span className="hidden lg:inline text-blue-100 group-hover:text-white transition-colors truncate max-w-[100px]">{user.email.split('@')[0]}</span></>
                    )}
                  </button>
                )}
              </div>
            </div>
          </header>

          {toast.show && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded shadow-lg flex items-center gap-2 transition-opacity ${
              toast.type === 'error' ? 'bg-red-500 text-white' : 
              toast.type === 'success' ? 'bg-green-500 text-white' : 'bg-blue-600 text-white'
            }`}>
              {toast.type === 'error' ? <i className="fa-solid fa-exclamation-circle"></i> : <i className="fa-solid fa-check-circle"></i>}
              {toast.message}
            </div>
          )}

          <main className="container mx-auto px-2 py-2 sm:px-4">
            {activeTab === 'attendance' && <AttendanceScreen appData={appData} setAppData={handleSetAppData} />}
            {activeTab === 'settings' && <SettingsScreen appData={appData} setAppData={handleSetAppData} showToast={showToast} />}
            {activeTab === 'sync' && <SyncScreen appData={appData} setAppData={handleSetAppData} showToast={showToast} user={user} onLogout={handleLogout} />}
          </main>
        </div>
      );
    }

    function NavButton({ active, onClick, icon, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex items-center gap-2 px-3 py-1.5 rounded text-sm font-medium transition-colors ${
            active ? 'bg-white text-blue-800 shadow' : 'text-blue-100 hover:bg-blue-700'
          }`}
        >
          {icon}
          <span className="hidden sm:inline">{label}</span>
        </button>
      );
    }

    function AttendanceScreen({ appData, setAppData }) {
      const gradesConfig = appData.settings?.grades || { 1: 1, 2: 0, 3: 0 };

      const visibleClasses = appData.classes.filter(c => {
        const [g, num] = c.classId.split('-');
        return parseInt(num) <= (gradesConfig[g] || 0);
      });

      const defaultClassId = visibleClasses.length > 0 ? visibleClasses[0].classId : "";
      const [currentClassId, setCurrentClassId] = useState(defaultClassId);
      const [memoModal, setMemoModal] = useState({ show: false, lessonId: null, studentId: null, text: '' });

      const [activeGradeTab, setActiveGradeTab] = useState(defaultClassId ? defaultClassId.split('-')[0] : "1");
      const [showMemo, setShowMemo] = useState(true);

      useEffect(() => {
        if (currentClassId) {
          setActiveGradeTab(currentClassId.split('-')[0]);
        }
      }, [currentClassId]);

      const safeClassId = visibleClasses.find(c => c.classId === currentClassId) ? currentClassId : defaultClassId;
      const currentClass = appData.classes.find(c => c.classId === safeClassId);
      const students = currentClass?.students || [];
      const lessons = appData.lessons.filter(l => l.classId === safeClassId).sort((a, b) => a.count - b.count);

      const addLesson = () => {
        if (!safeClassId) return;
        const nextCount = lessons.length > 0 ? Math.max(...lessons.map(l => l.count)) + 1 : 1;
        const newLesson = {
          id: `l_${Date.now()}`,
          classId: safeClassId,
          count: nextCount,
          date: getLocalDateString(),
          isLocked: false 
        };
        setAppData({ ...appData, lessons: [...appData.lessons, newLesson] });
      };

      const updateLessonDate = (lessonId, newDate) => {
        setAppData({
          ...appData,
          lessons: appData.lessons.map(l => l.id === lessonId ? { ...l, date: newDate } : l)
        });
      };

      const deleteLesson = (lessonId) => {
        if(window.confirm("この列を削除しますか？")){
          const targetLesson = appData.lessons.find(l => l.id === lessonId);
          if (!targetLesson) return;
          
          const remainingLessons = appData.lessons.filter(l => l.id !== lessonId);
          
          const targetClassLessons = remainingLessons
            .filter(l => l.classId === targetLesson.classId)
            .sort((a, b) => a.count - b.count);
            
          targetClassLessons.forEach((l, index) => {
            l.count = index + 1;
          });

          const updatedLessons = remainingLessons.map(l => {
            if (l.classId === targetLesson.classId) {
              return targetClassLessons.find(cl => cl.id === l.id) || l;
            }
            return l;
          });

          setAppData({
            ...appData,
            lessons: updatedLessons
          });
        }
      };

      const toggleLessonLock = (lessonId) => {
        setAppData({
          ...appData,
          lessons: appData.lessons.map(l => l.id === lessonId ? { ...l, isLocked: !l.isLocked } : l)
        });
      };

      const updateAttendance = (lessonId, studentId, status) => {
        const key = `${lessonId}_${studentId}`;
        setAppData({
          ...appData,
          attendances: {
            ...appData.attendances,
            [key]: { ...appData.attendances[key], status }
          }
        });
      };

      const saveMemo = () => {
        const key = `${memoModal.lessonId}_${memoModal.studentId}`;
        setAppData({
          ...appData,
          attendances: {
            ...appData.attendances,
            [key]: { ...appData.attendances[key], memo: memoModal.text }
          }
        });
        setMemoModal({ show: false, lessonId: null, studentId: null, text: '' });
      };

      const getAttendance = (lessonId, studentId) => {
        return appData.attendances[`${lessonId}_${studentId}`] || { status: "", memo: "" };
      };

      const countStatus = (studentId, statusToCount, customLessons = lessons) => {
        return customLessons.reduce((acc, lesson) => {
          const att = getAttendance(lesson.id, studentId);
          return acc + (att.status === statusToCount ? 1 : 0);
        }, 0);
      };

      const handlePrint = () => {
        window.print();
      };

      if (!currentClass) {
        return <div className="p-8 text-center text-gray-500">クラスが設定されていません。「クラス・名簿設定」から初期設定を行ってください。</div>;
      }

      return (
        <div className="bg-white rounded shadow p-2 sm:p-3 print-expand print:p-0 print:shadow-none">
          <div className="flex flex-wrap items-center justify-between mb-1 gap-2 print-hidden border-b pb-1">
            
            <div className="flex items-center gap-2 flex-wrap">
              <div className="flex gap-1 flex-wrap">
                {[1, 2, 3].map(g => {
                  const hasClasses = visibleClasses.some(c => c.classId.startsWith(`${g}-`));
                  if (!hasClasses) return null;
                  return (
                    <button
                      key={`grade-${g}`}
                      onClick={() => {
                        setActiveGradeTab(g.toString());
                        const firstClass = visibleClasses.find(c => c.classId.startsWith(`${g}-`));
                        if (firstClass) setCurrentClassId(firstClass.classId);
                      }}
                      className={`px-3 py-1.5 rounded text-sm font-bold transition-colors border ${
                        activeGradeTab === g.toString()
                          ? 'bg-blue-700 text-white border-blue-700 shadow'
                          : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-100'
                      }`}
                    >
                      {g}年
                    </button>
                  );
                })}
              </div>

              <i className="fa-solid fa-angle-right text-gray-300 text-sm mx-1"></i>

              <div className="flex gap-1 flex-wrap">
                {visibleClasses.filter(c => c.classId.startsWith(`${activeGradeTab}-`)).map(c => (
                  <button
                    key={c.classId}
                    onClick={() => setCurrentClassId(c.classId)}
                    className={`px-3 py-1.5 rounded text-sm font-bold transition-colors border ${
                      safeClassId === c.classId
                        ? 'bg-blue-600 text-white border-blue-600 shadow'
                        : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-100'
                    }`}
                  >
                    {c.className.replace(`${activeGradeTab}年`, '')}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
              <span className="text-xs text-gray-500 font-bold bg-gray-100 px-2 py-1 rounded">計 {students.length}名</span>
              <div className="flex gap-1">
                <button onClick={addLesson} className="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-sm font-medium">
                  <i className="fa-solid fa-plus"></i> 授業追加
                </button>
                
                <button onClick={() => setShowMemo(!showMemo)} className="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-sm font-medium print-hidden">
                  <i className={`fa-solid ${showMemo ? 'fa-eye-slash' : 'fa-eye'}`}></i> {showMemo ? '非表示' : '表示'}
                </button>
                
                <button onClick={handlePrint} className="flex items-center gap-1 border border-gray-300 hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded text-sm font-medium">
                  <i className="fa-solid fa-print"></i> 印刷
                </button>
              </div>
            </div>
          </div>

          <div className="overflow-auto max-h-[calc(100vh-190px)] border border-gray-300 rounded bg-white print-expand relative print:hidden">
            <table className="w-max bg-white border-collapse text-sm">
              <thead className="bg-gray-100 sticky top-0 z-30 shadow-sm text-gray-700 print:bg-white">
                <tr>
                  <th className="sticky left-0 bg-gray-200 z-40 p-2 print:p-1 border border-gray-300 w-12 min-w-[3rem] print:w-auto print:min-w-0 print:text-[10px]">番号</th>
                  <th className="sticky left-12 bg-gray-200 z-40 p-2 border border-gray-300 w-32 min-w-[8rem]">氏名</th>
                  <th className="sticky left-[11rem] bg-gray-200 z-40 p-2 border border-gray-300 w-12 min-w-[3rem]">性別</th>
                  
                  {lessons.map(l => (
                    <th key={l.id} className="p-1 border border-gray-300 w-[120px] min-w-[120px] max-w-[120px] bg-gray-50 overflow-hidden align-top">
                      <div className="flex flex-col gap-1 text-center">
                        <input 
                          type="date" 
                          value={l.date} 
                          onChange={(e) => updateLessonDate(l.id, e.target.value)}
                          disabled={l.isLocked}
                          className={`w-full text-[10px] leading-tight border-none bg-transparent focus:ring-0 p-0 text-center font-normal ${l.isLocked ? 'text-gray-400 cursor-not-allowed' : 'text-gray-600'}`}
                        />
                        <div className="flex justify-center items-center px-0.5 relative">
                          <span className={`font-bold text-[10px] px-1 py-0.5 rounded-full ${l.isLocked ? 'bg-gray-200 text-gray-500' : 'bg-blue-100 text-blue-800'}`}>
                            {l.count}回
                          </span>
                          {!l.isLocked && (
                            <button onClick={() => deleteLesson(l.id)} className="absolute right-0 text-gray-400 hover:text-red-500" title="この列を削除">
                              <i className="fa-solid fa-trash text-[10px]"></i>
                            </button>
                          )}
                        </div>
                        <div className="flex justify-center mt-0.5">
                          <button 
                            onClick={() => toggleLessonLock(l.id)}
                            className={`text-[9px] w-[80%] py-[2px] rounded font-bold transition-colors flex items-center justify-center gap-1 border ${
                              l.isLocked 
                                ? 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border-emerald-200' 
                                : 'bg-white text-gray-500 hover:bg-gray-100 border-gray-300'
                            }`}
                          >
                            {l.isLocked ? <><i className="fa-solid fa-lock text-[8px]"></i>入力完了</> : <><i className="fa-solid fa-pen text-[8px]"></i>未入力</>}
                          </button>
                        </div>
                      </div>
                    </th>
                  ))}
                  
                  <th className="sticky right-[14rem] bg-red-50 z-40 p-2 border border-gray-300 w-14 min-w-[3.5rem] text-red-800 text-xs">欠席</th>
                  <th className="sticky right-[10.5rem] bg-yellow-50 z-40 p-2 border border-gray-300 w-14 min-w-[3.5rem] text-yellow-800 text-xs">遅刻</th>
                  <th className="sticky right-[7rem] bg-orange-50 z-40 p-2 border border-gray-300 w-14 min-w-[3.5rem] text-orange-800 text-xs">早退</th>
                  <th className="sticky right-[3.5rem] bg-green-50 z-40 p-2 border border-gray-300 w-14 min-w-[3.5rem] text-green-800 text-xs">保健室</th>
                  <th className="sticky right-0 bg-gray-100 z-40 p-2 border border-gray-300 w-14 min-w-[3.5rem] text-gray-600 text-xs">他</th>
                </tr>
              </thead>
              <tbody>
                {students.length === 0 ? (
                  <tr><td colSpan={8 + lessons.length} className="p-4 text-center text-gray-500">生徒データがありません</td></tr>
                ) : students.map(s => {
                  const status = s.status || "在籍";
                  const isInactive = status === "転出" || status === "休学";
                  const rowBg = isInactive ? "bg-gray-100" : "bg-white";
                  const hoverBg = isInactive ? "group-hover:bg-gray-200" : "group-hover:bg-blue-50";

                  return (
                  <tr key={s.id} className={`group ${isInactive ? 'opacity-80' : ''}`}>
                    <td className={`sticky left-0 z-20 ${rowBg} border border-gray-300 p-2 text-center text-gray-500 font-medium ${hoverBg}`}>{s.number}</td>
                    <td className={`sticky left-12 z-20 ${rowBg} border border-gray-300 p-2 ${hoverBg}`}>
                      <div className="flex items-center gap-1">
                        <div className={`font-bold whitespace-nowrap ${isInactive ? 'text-gray-500 line-through decoration-gray-400' : ''}`}>{s.name}</div>
                        {isInactive && <span className="text-[9px] font-bold bg-red-100 text-red-700 px-1 rounded whitespace-nowrap">{status}</span>}
                      </div>
                      <div className="text-[10px] text-gray-400 truncate">{s.furigana}</div>
                    </td>
                    <td className={`sticky left-[11rem] z-20 ${rowBg} border border-gray-300 p-2 text-center text-xs text-gray-500 ${hoverBg}`}>
                      {s.gender}
                    </td>
                    
                    {lessons.map(l => {
                      const att = getAttendance(l.id, s.id);
                      const conf = getStatusConfig(att.status);
                      
                      let cellBgColor = conf.color;
                      if (isInactive) {
                        cellBgColor = `${rowBg} text-gray-400`;
                      } else if (l.isLocked && cellBgColor.includes('bg-')) {
                        cellBgColor = cellBgColor.replace('bg-', 'bg-opacity-50 bg-');
                      }

                      return (
                        <td key={l.id} className={`border border-gray-300 p-0 relative w-[120px] min-w-[120px] max-w-[120px] align-top ${cellBgColor} print:hidden`}>
                          <div className="flex flex-col h-full w-full min-h-[46px]">
                            <div className="w-full">
                              <select
                                value={att.status}
                                onChange={(e) => updateAttendance(l.id, s.id, e.target.value)}
                                disabled={l.isLocked}
                                className={`w-full appearance-none bg-transparent border-none focus:ring-0 text-center text-xs font-bold cursor-pointer pt-1.5 pb-0.5 px-1 ${isInactive ? 'text-gray-400' : (att.status ? '' : 'text-gray-300')} ${l.isLocked ? 'cursor-not-allowed opacity-60' : ''}`}
                              >
                                {STATUS_OPTIONS.map(opt => (
                                  <option key={opt.value} value={opt.value} className="text-gray-800 bg-white">{opt.label}</option>
                                ))}
                              </select>
                            </div>
                            
                            {showMemo && (
                              <div className="flex items-center justify-between px-1 pb-1 w-full mt-auto gap-1">
                                <div 
                                  className={`text-[10px] flex-1 truncate text-left ${l.isLocked || isInactive ? 'text-gray-400 cursor-not-allowed' : 'text-gray-600 cursor-pointer'}`}
                                  onClick={() => !l.isLocked && att.memo && setMemoModal({ show: true, lessonId: l.id, studentId: s.id, text: att.memo })}
                                  title={l.isLocked ? `メモ: ${att.memo} (保護中)` : att.memo}
                                >
                                  {att.memo || '\u00A0'}
                                </div>
                                
                                <button 
                                  onClick={() => !l.isLocked && setMemoModal({ show: true, lessonId: l.id, studentId: s.id, text: att.memo || '' })}
                                  disabled={l.isLocked}
                                  className={`shrink-0 p-1 rounded-full leading-none ${att.memo ? (isInactive ? 'text-blue-400' : 'text-blue-600') : 'text-gray-300 hover:text-gray-500 hover:bg-black/5'} ${l.isLocked ? 'cursor-not-allowed opacity-50' : ''}`}
                                  title={l.isLocked ? (att.memo ? `メモ: ${att.memo} (保護中)` : "保護中のため編集不可") : (att.memo ? "メモを編集" : "メモを追加")}
                                >
                                  <i className="fa-solid fa-comment-dots text-[11px]"></i>
                                </button>
                              </div>
                            )}
                          </div>
                        </td>
                      );
                    })}
                    
                    <td className={`sticky right-[14rem] z-20 ${rowBg} border border-gray-300 p-2 text-center font-bold ${isInactive ? 'text-gray-400' : 'text-red-600'} ${hoverBg}`}>{countStatus(s.id, '欠席') || ''}</td>
                    <td className={`sticky right-[10.5rem] z-20 ${rowBg} border border-gray-300 p-2 text-center font-bold ${isInactive ? 'text-gray-400' : 'text-yellow-600'} ${hoverBg}`}>{countStatus(s.id, '遅刻') || ''}</td>
                    <td className={`sticky right-[7rem] z-20 ${rowBg} border border-gray-300 p-2 text-center font-bold ${isInactive ? 'text-gray-400' : 'text-orange-600'} ${hoverBg}`}>{countStatus(s.id, '早退') || ''}</td>
                    <td className={`sticky right-[3.5rem] z-20 ${rowBg} border border-gray-300 p-2 text-center font-bold ${isInactive ? 'text-gray-400' : 'text-green-600'} ${hoverBg}`}>{countStatus(s.id, '保健室') || ''}</td>
                    <td className={`sticky right-0 z-20 ${rowBg} border border-gray-300 p-2 text-center font-bold ${isInactive ? 'text-gray-400' : 'text-gray-500'} ${hoverBg}`}>{countStatus(s.id, 'その他') || ''}</td>
                  </tr>
                )})}
              </tbody>
            </table>
          </div>

          <div className="hidden print:block w-full text-black">
            {visibleClasses.filter(c => c.classId.startsWith(`${activeGradeTab}-`)).map((cls, index) => {
              const clsStudents = cls.students || [];
              const clsLessons = appData.lessons.filter(l => l.classId === cls.classId).sort((a, b) => a.count - b.count);
              
              return (
                <div key={`print-${cls.classId}`} className={`w-full ${index > 0 ? "page-break" : ""}`}>
                  <h2 className="text-lg font-bold mb-3 text-center border-b-2 border-black pb-1">
                    {cls.className} 出欠記録・備考一覧
                  </h2>
                  <table className="w-full border-collapse border border-black text-sm">
                    <thead>
                      <tr className="bg-gray-100">
                        <th className="border border-black px-1 py-[5px] w-8 text-[12px] leading-tight">番号</th>
                        <th className="border border-black px-1 py-[5px] w-32 text-[12px] leading-tight">氏名</th>
                        <th className="border border-black px-1 py-[5px] w-8 text-[12px] leading-tight">性別</th>
                        <th className="border border-black px-1 py-[5px] w-8 text-[12px] leading-tight">欠席</th>
                        <th className="border border-black px-1 py-[5px] w-8 text-[12px] leading-tight">遅刻</th>
                        <th className="border border-black px-1 py-[5px] w-8 text-[12px] leading-tight">早退</th>
                        <th className="border border-black px-1 py-[5px] w-8 text-[12px] leading-tight">保健</th>
                        <th className="border border-black px-1 py-[5px] w-8 text-[12px] leading-tight">他</th>
                        <th className="border border-black px-1 py-[5px] text-left text-[12px] leading-tight">備考（入力されたメモ）</th>
                      </tr>
                    </thead>
                    <tbody>
                      {clsStudents.length === 0 ? (
                        <tr><td colSpan={9} className="border border-black p-2 text-center">生徒データがありません</td></tr>
                      ) : clsStudents.map(s => {
                        const status = s.status || "在籍";
                        const isInactive = status === "転出" || status === "休学";
                        return (
                          <tr key={s.id} className={isInactive ? 'text-gray-600' : ''}>
                            <td className="border border-black px-1 py-[5px] text-center text-[12px] leading-none">{s.number}</td>
                            <td className="border border-black px-1 py-[5px]">
                              <div className="flex flex-col justify-center">
                                <div className="flex items-center gap-1">
                                  <span className={`text-[12px] font-bold leading-none ${isInactive ? 'line-through decoration-gray-400' : ''}`}>{s.name}</span>
                                  {isInactive && <span className="text-[7px] border border-gray-500 px-0.5 rounded leading-none">{status}</span>}
                                </div>
                                <span className="text-[7px] text-gray-500 truncate leading-none mt-[1px]">{s.furigana}</span>
                              </div>
                            </td>
                            <td className="border border-black px-1 py-[5px] text-center text-[12px] leading-none">{s.gender}</td>
                            <td className="border border-black px-1 py-[5px] text-center text-[12px] font-bold leading-none">{countStatus(s.id, '欠席', clsLessons) || ''}</td>
                            <td className="border border-black px-1 py-[5px] text-center text-[12px] font-bold leading-none">{countStatus(s.id, '遅刻', clsLessons) || ''}</td>
                            <td className="border border-black px-1 py-[5px] text-center text-[12px] font-bold leading-none">{countStatus(s.id, '早退', clsLessons) || ''}</td>
                            <td className="border border-black px-1 py-[5px] text-center text-[12px] font-bold leading-none">{countStatus(s.id, '保健室', clsLessons) || ''}</td>
                            <td className="border border-black px-1 py-[5px] text-center text-[12px] font-bold leading-none">{countStatus(s.id, 'その他', clsLessons) || ''}</td>
                            <td className="border border-black px-1 py-[5px] text-left align-top whitespace-pre-wrap">
                              {clsLessons.map(l => {
                                const att = getAttendance(l.id, s.id);
                                if (!att.memo) return null;
                                const dateStr = l.date ? `${new Date(l.date).getMonth() + 1}/${new Date(l.date).getDate()}` : '';
                                return (
                                  <div key={l.id} className="text-[9px] leading-tight mb-0.5 last:mb-0">
                                    <span className="font-bold text-gray-700">[{dateStr} 第{l.count}回]</span> {att.memo}
                                  </div>
                                );
                              })}
                            </td>
                          </tr>
                        )
                      })}
                    </tbody>
                  </table>
                </div>
              );
            })}
          </div>

          {memoModal.show && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 print-hidden">
              <div className="bg-white rounded-lg shadow-xl w-full max-w-sm overflow-hidden">
                <div className="bg-blue-800 text-white px-4 py-3 font-bold">メモの編集</div>
                <div className="p-4">
                  <p className="text-sm text-gray-600 mb-2">
                    {currentClass.students.find(s => s.id === memoModal.studentId)?.name} さんの記録
                  </p>
                  <textarea
                    autoFocus
                    value={memoModal.text}
                    onChange={(e) => setMemoModal({ ...memoModal, text: e.target.value })}
                    className="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 h-24"
                    placeholder="遅刻の理由、保健室での様子など..."
                  />
                </div>
                <div className="bg-gray-50 px-4 py-3 flex justify-end gap-2 border-t">
                  <button onClick={() => setMemoModal({ ...memoModal, show: false })} className="px-4 py-2 rounded border hover:bg-gray-100 text-sm">キャンセル</button>
                  <button onClick={saveMemo} className="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold flex items-center gap-1">
                    <i className="fa-solid fa-save"></i> 保存
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SettingsScreen({ appData, setAppData, showToast }) {
      const initialGrades = appData.settings?.grades || {
        1: appData.settings?.grade === 1 ? (appData.settings.classCount || 1) : (appData.classes.filter(c => c.classId.startsWith('1-')).length || 0),
        2: appData.settings?.grade === 2 ? (appData.settings.classCount || 1) : (appData.classes.filter(c => c.classId.startsWith('2-')).length || 0),
        3: appData.settings?.grade === 3 ? (appData.settings.classCount || 1) : (appData.classes.filter(c => c.classId.startsWith('3-')).length || 0),
      };
      
      const [gradesConfig, setGradesConfig] = useState(initialGrades);
      const [activeEditClassId, setActiveEditClassId] = useState(appData.classes[0]?.classId || null);
      const [activeGradeTab, setActiveGradeTab] = useState(activeEditClassId ? activeEditClassId.split('-')[0] : "1");
      
      const [bulkImport, setBulkImport] = useState({ show: false, classId: null, text: '' });

      useEffect(() => {
        if (activeEditClassId) {
          setActiveGradeTab(activeEditClassId.split('-')[0]);
        }
      }, [activeEditClassId]);

      const handleConfigChange = (grade, value) => {
        setGradesConfig({ ...gradesConfig, [grade]: Number(value) });
      };

      const applySettings = () => {
        let updatedClasses = [...appData.classes];
        
        [1, 2, 3].forEach(g => {
          const count = gradesConfig[g] || 0;
          for (let c = 1; c <= count; c++) {
            const classId = `${g}-${c}`;
            if (!updatedClasses.find(cls => cls.classId === classId)) {
              updatedClasses.push({
                classId: classId,
                className: `${g}年${c}組`,
                students: []
              });
            }
          }
        });
        
        const hasVisibleClass = updatedClasses.some(c => {
          const [g, num] = c.classId.split('-');
          return parseInt(num) <= (gradesConfig[g] || 0);
        });

        if (!hasVisibleClass) {
          showToast("最低でも1つのクラスが表示されるよう設定してください", "error");
          return;
        }

        setAppData({
          ...appData,
          settings: { ...appData.settings, grades: gradesConfig },
          classes: updatedClasses
        });

        const [activeG, activeNum] = (activeEditClassId || "1-1").split('-');
        if (parseInt(activeNum) > (gradesConfig[activeG] || 0)) {
           const firstVisible = updatedClasses.find(c => {
             const [g, num] = c.classId.split('-');
             return parseInt(num) <= (gradesConfig[g] || 0);
           });
           setActiveEditClassId(firstVisible?.classId || null);
        }

        showToast("クラス構成を更新しました。（※減らしたクラスのデータも保護されています）", "success");
      };

      const handleStudentChange = (classId, studentId, field, value) => {
        setAppData({
          ...appData,
          classes: appData.classes.map(c => {
            if (c.classId !== classId) return c;
            return {
              ...c,
              students: c.students.map(s => s.id === studentId ? { ...s, [field]: value } : s)
            };
          })
        });
      };

      const addStudent = (classId) => {
        setAppData({
          ...appData,
          classes: appData.classes.map(c => {
            if (c.classId !== classId) return c;
            const nextNum = c.students.length > 0 ? Math.max(...c.students.map(s => s.number)) + 1 : 1;
            return {
              ...c,
              students: [...c.students, { id: `s_${Date.now()}`, number: nextNum, name: "", furigana: "", gender: "男", status: "在籍" }]
            };
          })
        });
      };

      const removeStudent = (classId, studentId) => {
        if(!window.confirm("【警告】\nこの生徒を完全に削除すると、過去の出欠データも全て消去されてしまいます。\n\n※年度途中の転出等の場合は、削除せずに左の「状態」を「転出」に変更することをお勧めします。\n\n本当に完全に削除してよろしいですか？")) return;
        setAppData({
          ...appData,
          classes: appData.classes.map(c => {
            if (c.classId !== classId) return c;
            return {
              ...c,
              students: c.students.filter(s => s.id !== studentId)
            };
          })
        });
      };

      const processBulkImport = () => {
        const { classId, text } = bulkImport;
        if (!text.trim()) {
          setBulkImport({ ...bulkImport, show: false });
          return;
        }

        const lines = text.split('\n').filter(line => line.trim() !== '');
        const newStudents = [];
        
        const targetClass = appData.classes.find(c => c.classId === classId);
        let currentMaxNumber = targetClass.students.length > 0 ? Math.max(...targetClass.students.map(s => s.number)) : 0;

        lines.forEach((line, index) => {
          const cols = line.split(/[\t,]/).map(c => c.trim().replace(/^"|"$/g, ''));
          if (cols.length === 0 || !cols[0]) return;

          let number = currentMaxNumber + 1;
          let name = "";
          let furigana = "";
          let gender = "その他";

          if (cols.length > 0) {
            const firstIsNum = !isNaN(parseInt(cols[0]));
            if (firstIsNum) {
              number = parseInt(cols[0]);
              name = cols[1] || "";
              furigana = cols[2] || "";
              gender = cols[3] || "その他";
            } else {
              name = cols[0];
              furigana = cols[1] || "";
              gender = cols[2] || "その他";
            }
            if(!["男", "女", "その他"].includes(gender)) gender = "その他";
          }

          currentMaxNumber = number;

          newStudents.push({
            id: `s_bulk_${Date.now()}_${index}`,
            number,
            name,
            furigana,
            gender,
            status: "在籍"
          });
        });

        if (newStudents.length > 0) {
          setAppData({
            ...appData,
            classes: appData.classes.map(c => {
              if (c.classId !== classId) return c;
              return {
                ...c,
                students: [...c.students, ...newStudents]
              };
            })
          });
          showToast(`${newStudents.length}名の生徒を一括追加しました`, "success");
        }
        
        setBulkImport({ show: false, classId: null, text: '' });
      };

      const visibleClasses = appData.classes.filter(c => {
        const [g, num] = c.classId.split('-');
        return parseInt(num) <= (appData.settings.grades[g] || 0);
      });

      const activeClass = appData.classes.find(c => c.classId === activeEditClassId);

      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          <div className="bg-white p-6 rounded shadow border-t-4 border-blue-800">
            
            <div className="flex flex-wrap items-center justify-center gap-6 mb-6 pb-6 border-b border-gray-200">
              <div className="flex flex-wrap justify-center gap-6">
                {[1, 2, 3].map(g => (
                  <div key={g} className="flex items-center gap-2">
                    <label className="text-sm font-bold text-gray-700 whitespace-nowrap">{g}年生</label>
                    <div className="flex items-center gap-1">
                      <select 
                        value={gradesConfig[g]} 
                        onChange={e => handleConfigChange(g, e.target.value)} 
                        className="border p-1.5 rounded w-16 text-center focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer" 
                      >
                        {[...Array(16).keys()].map(num => (
                          <option key={num} value={num}>{num}</option>
                        ))}
                      </select>
                      <span className="text-sm text-gray-500 whitespace-nowrap">クラス</span>
                    </div>
                  </div>
                ))}
              </div>
              <button onClick={applySettings} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-bold transition-colors shadow whitespace-nowrap">
                設定を適用する
              </button>
            </div>

            {visibleClasses.length > 0 && (
              <div>
                <div className="flex flex-wrap items-center gap-2 mb-4 border-b pb-2">
                  <div className="flex gap-1 flex-wrap">
                    {[1, 2, 3].map(g => {
                      const hasClasses = visibleClasses.some(c => c.classId.startsWith(`${g}-`));
                      if (!hasClasses) return null;
                      return (
                        <button
                          key={`grade-${g}`}
                          onClick={() => {
                            setActiveGradeTab(g.toString());
                            const firstClass = visibleClasses.find(c => c.classId.startsWith(`${g}-`));
                            if (firstClass) setActiveEditClassId(firstClass.classId);
                          }}
                          className={`px-3 py-1.5 rounded text-sm font-bold transition-colors border ${
                            activeGradeTab === g.toString()
                              ? 'bg-blue-700 text-white border-blue-700 shadow'
                              : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-100'
                          }`}
                        >
                          {g}年
                        </button>
                      );
                    })}
                  </div>

                  <i className="fa-solid fa-angle-right text-gray-300 text-sm mx-1"></i>

                  <div className="flex gap-1 flex-wrap">
                    {visibleClasses.filter(c => c.classId.startsWith(`${activeGradeTab}-`)).map(c => (
                      <button
                        key={c.classId}
                        onClick={() => setActiveEditClassId(c.classId)}
                        className={`px-3 py-1.5 rounded text-sm font-bold transition-colors border ${
                          activeEditClassId === c.classId
                            ? 'bg-blue-600 text-white border-blue-600 shadow'
                            : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-100'
                        }`}
                      >
                        {c.className.replace(`${activeGradeTab}年`, '')}
                      </button>
                    ))}
                  </div>
                </div>

                {activeClass && (
                  <div>
                    <div className="flex flex-wrap justify-between items-center mb-2 gap-2">
                      <span className="text-sm font-bold text-gray-600">{activeClass.className} の生徒一覧 ({activeClass.students.length}名)</span>
                      <div className="flex gap-2">
                        <button 
                          onClick={() => setBulkImport({ show: true, classId: activeClass.classId, text: '' })} 
                          className="flex items-center gap-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded transition-colors"
                        >
                          <i className="fa-solid fa-file-import"></i> 一括追加
                        </button>
                        <button onClick={() => addStudent(activeClass.classId)} className="flex items-center gap-2 text-sm bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded transition-colors">
                          <i className="fa-solid fa-plus"></i> 1名追加
                        </button>
                      </div>
                    </div>
                    
                    <div className="overflow-x-auto border rounded">
                      <table className="min-w-full text-sm">
                        <thead className="bg-gray-100">
                          <tr>
                            <th className="p-2 border-b w-16">番号</th>
                            <th className="p-2 border-b">名前</th>
                            <th className="p-2 border-b">ふりがな</th>
                            <th className="p-2 border-b w-20">性別</th>
                            <th className="p-2 border-b w-24">状態</th>
                            <th className="p-2 border-b w-16">削除</th>
                          </tr>
                        </thead>
                        <tbody>
                          {activeClass.students.map((s, index) => (
                            <tr key={s.id} className="hover:bg-gray-50">
                              <td className="p-1 border-b text-center">
                                <input 
                                  type="number" value={s.number} 
                                  onChange={(e) => handleStudentChange(activeClass.classId, s.id, 'number', Number(e.target.value))}
                                  className="w-full p-1 border rounded text-center focus:ring-2 focus:ring-blue-500"
                                />
                              </td>
                              <td className="p-1 border-b">
                                <input 
                                  type="text" value={s.name} placeholder="例: 山田 太郎"
                                  onChange={(e) => handleStudentChange(activeClass.classId, s.id, 'name', e.target.value)}
                                  className={`w-full p-1 border rounded focus:ring-2 focus:ring-blue-500 ${s.status === '転出' || s.status === '休学' ? 'text-gray-400 bg-gray-50' : ''}`}
                                />
                              </td>
                              <td className="p-1 border-b">
                                <input 
                                  type="text" value={s.furigana} placeholder="例: やまだ たろう"
                                  onChange={(e) => handleStudentChange(activeClass.classId, s.id, 'furigana', e.target.value)}
                                  className="w-full p-1 border rounded focus:ring-2 focus:ring-blue-500"
                                />
                              </td>
                              <td className="p-1 border-b">
                                <select 
                                  value={s.gender} 
                                  onChange={(e) => handleStudentChange(activeClass.classId, s.id, 'gender', e.target.value)}
                                  className="w-full p-1 border rounded focus:ring-2 focus:ring-blue-500"
                                >
                                  <option value="男">男</option>
                                  <option value="女">女</option>
                                  <option value="その他">その他</option>
                                </select>
                              </td>
                              <td className="p-1 border-b">
                                <select 
                                  value={s.status || "在籍"} 
                                  onChange={(e) => handleStudentChange(activeClass.classId, s.id, 'status', e.target.value)}
                                  className={`w-full p-1 border rounded font-bold focus:ring-2 focus:ring-blue-500 ${s.status === '転出' || s.status === '休学' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`}
                                >
                                  <option value="在籍">在籍</option>
                                  <option value="転出">転出</option>
                                  <option value="休学">休学</option>
                                </select>
                              </td>
                              <td className="p-1 border-b text-center">
                                <button onClick={() => removeStudent(activeClass.classId, s.id)} className="p-2 text-red-500 hover:bg-red-50 rounded transition-colors" title="削除（非推奨）">
                                  <i className="fa-solid fa-trash"></i>
                                </button>
                              </td>
                            </tr>
                          ))}
                          {activeClass.students.length === 0 && (
                            <tr><td colSpan={6} className="p-8 text-center text-gray-500">生徒を追加してください</td></tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          {bulkImport.show && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="bg-indigo-800 text-white px-4 py-3 font-bold flex justify-between items-center">
                  <span><i className="fa-solid fa-file-import mr-2"></i>名簿データの一括追加</span>
                  <button onClick={() => setBulkImport({ show: false, classId: null, text: '' })} className="text-white hover:text-gray-300">
                    <i className="fa-solid fa-times text-lg"></i>
                  </button>
                </div>
                <div className="p-4 overflow-y-auto">
                  <div className="bg-blue-50 border border-blue-200 text-blue-800 text-sm p-3 rounded mb-4">
                    <p className="font-bold mb-1">💡 Excelやスプレッドシートからコピー＆ペーストできます</p>
                    <ul className="list-disc pl-5 space-y-1 text-xs">
                      <li>以下の形式で、表計算ソフトからセルをコピーして下の枠に貼り付けてください。</li>
                      <li>形式: <strong>「出席番号」 「氏名」 「ふりがな」 「性別」</strong> の順</li>
                      <li>出席番号が省略された場合は、現在の最大番号から自動で連番が振られます。</li>
                    </ul>
                  </div>
                  <textarea
                    autoFocus
                    value={bulkImport.text}
                    onChange={(e) => setBulkImport({ ...bulkImport, text: e.target.value })}
                    className="w-full border border-gray-300 rounded p-3 text-sm font-mono whitespace-pre focus:ring-2 focus:ring-indigo-500 h-64"
                    placeholder="ここにExcelのセルを貼り付けてください...&#10;&#10;例:&#10;1&#9;山田 太郎&#9;やまだ たろう&#9;男&#10;2&#9;佐藤 花子&#9;さとう はなこ&#9;女&#10;3&#9;鈴木 一郎&#9;&#9;男"
                  />
                </div>
                <div className="bg-gray-50 px-4 py-3 flex justify-end gap-2 border-t">
                  <button onClick={() => setBulkImport({ show: false, classId: null, text: '' })} className="px-4 py-2 rounded border hover:bg-gray-100 text-sm font-medium">
                    キャンセル
                  </button>
                  <button onClick={processBulkImport} className="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold flex items-center gap-2">
                    <i className="fa-solid fa-check"></i> この内容で追加する
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SyncScreen({ appData, setAppData, showToast, user, onLogout }) {
      const handleDownloadExport = () => {
        const data = {
          ...appData,
          exportDate: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const d = new Date();
        const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        a.download = `attendance_backup_${dateStr}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("データをバックアップファイルとしてダウンロードしました", "success");
      };

      const handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        
        if (window.confirm('選択したファイルからデータを復元しますか？\n現在のデータはすべて上書きされます。')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const parsed = JSON.parse(e.target.result);
              if (!parsed.classes || !parsed.settings) throw new Error("不正なデータフォーマットです");
              setAppData(parsed);
              showToast("ファイルからデータを復元しました", "success");
            } catch (err) {
              showToast("ファイルの形式が正しくありません", "error");
              console.error(err);
            }
          };
          reader.readAsText(file);
        }
        event.target.value = ''; // Reset
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-white p-6 rounded shadow border-t-4 border-blue-500">
            <h2 className="text-lg font-bold mb-3 flex items-center gap-2">
              <i className="fa-solid fa-user-circle text-blue-500"></i>
              アカウントと同期
            </h2>
            <p className="text-sm text-gray-600 mb-4">
              ログイン中のアカウントにデータが保存され、他の端末と自動的にリアルタイム同期されます。
            </p>
            
            <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-blue-50 p-4 rounded-lg border border-blue-100">
              <div className="flex flex-col w-full sm:w-auto min-w-0">
                <span className="text-[10px] font-bold text-blue-800 mb-0.5">ログイン中のアカウント:</span>
                <span className="text-sm sm:text-base font-bold text-blue-600 truncate">
                  {user ? (user.isAnonymous ? "ゲストユーザー (お試し中)" : user.email) : "未ログイン"}
                </span>
              </div>
              {user && (
                <button 
                  onClick={onLogout}
                  className="w-full sm:w-auto px-6 py-2 bg-red-500 text-white rounded font-bold hover:bg-red-600 shadow-sm transition whitespace-nowrap flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-sign-out-alt"></i> ログアウト
                </button>
              )}
            </div>
          </div>

          <div className="bg-white p-6 rounded shadow">
            <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><i className="fa-solid fa-file-export"></i> 手動データ引き継ぎ（バックアップ・復元）</h2>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="border border-gray-200 rounded-lg p-5 bg-gray-50 flex flex-col">
                <h3 className="font-bold text-gray-800 mb-2 border-b pb-2 flex items-center gap-2">
                  <i className="fa-solid fa-file-download text-blue-600"></i>
                  バックアップの保存（エクスポート）
                </h3>
                <p className="text-sm text-gray-600 mb-4 flex-1">
                  生徒の名簿情報、出欠記録など、すべてのデータをJSONファイルとしてダウンロードします。定期的なバックアップとして保存してください。
                </p>
                <button 
                  onClick={handleDownloadExport} 
                  className="w-full flex justify-center items-center gap-2 bg-white border-2 border-blue-600 text-blue-600 hover:bg-blue-50 px-4 py-3 rounded font-bold transition-colors"
                >
                  <i className="fa-solid fa-download"></i> バックアップファイルを保存
                </button>
              </div>

              <div className="border border-gray-200 rounded-lg p-5 bg-gray-50 flex flex-col">
                <h3 className="font-bold text-gray-800 mb-2 border-b pb-2 flex items-center gap-2">
                  <i className="fa-solid fa-file-upload text-green-600"></i>
                  データを取り込む（インポート）
                </h3>
                <p className="text-sm text-gray-600 mb-4">
                  保存しておいたバックアップファイル(.json)を選択して、データを復元します。<br/>
                  <span className="text-red-500 font-bold text-xs">※現在のデータは上書きされ消去されます。</span>
                </p>
                
                <div className="mt-auto">
                  <input type="file" id="import-file" accept=".json" className="hidden" onChange={handleFileUpload} />
                  <button 
                    onClick={() => document.getElementById('import-file').click()} 
                    className="w-full flex justify-center items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded font-bold transition-colors"
                  >
                    <i className="fa-solid fa-upload"></i> ファイルを選択して復元
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div className="border border-red-200 bg-red-50 p-6 rounded shadow mt-10">
            <h3 className="text-red-800 font-bold flex items-center gap-2 mb-2"><i className="fa-solid fa-triangle-exclamation"></i> 危険な操作</h3>
            <p className="text-sm text-red-600 mb-4">設定や生徒情報をすべて消去して初期状態に戻します。クラウド上のデータも同時に消去されます。元には戻せません。</p>
            <button onClick={() => {
              if (window.confirm("すべてのデータを消去して初期状態に戻します。本当に実行してよろしいですか？")) {
                setAppData(DEFAULT_DATA);
                showToast("データをすべて初期化しました", "success");
              }
            }} className="bg-white border border-red-500 text-red-600 hover:bg-red-50 px-4 py-2 rounded text-sm font-bold flex items-center gap-2 transition-colors">
              <i className="fa-solid fa-trash"></i> データを全消去する
            </button>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
